name: Bug report
description: Report a reproducible software defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Remove credentials, private paths, and restricted benchmark content.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HelloLoop and Python versions
    validations:
      required: true
