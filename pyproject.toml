[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helloloop"
version = "1.0.0"
description = "Auditable uncertainty-aware control loops for long-horizon LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "HelloLoop authors"}]
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
agent = ["mini-swe-agent==2.4.5", "litellm==1.82.6"]
data = ["datasets==5.0.0"]
evaluation = ["swebench==4.1.0"]
models = ["openai==2.46.0"]
analysis = [
  "matplotlib==3.10.8",
  "numpy==2.4.6",
  "pandas==3.0.3",
  "scikit-learn==1.8.0",
  "scipy==1.16.3",
  "statsmodels==0.14.6",
]
dev = ["pytest>=7.4,<10", "ruff>=0.5,<1"]

[project.scripts]
helloloop = "helloloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
